<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rest Your Fundraiser Account</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #1a73e8; padding: 10px; text-align: center; }
        .header img { max-height: 50px; }
        .content { padding: 20px; background-color: #f9f9f9; }
        .otp { font-size: 24px; font-weight: bold; color: #1a73e8; margin: 15px 0; }
        .footer { margin-top: 20px; font-size: 12px; text-align: center; color: #777; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Fundraiser</h1>
        </div>
        <div class="content">
            <h2>Welcome to Fundraiser!</h2>
            <h3>Dear {{ user }}</h3>
            <p>Thank you for signing up. To activate your account, please use the OTP below:</p>
            <div class="otp">{{ otp }}</div>
            <p>This OTP will expire in <strong>10 minutes</strong>.</p>
            <p>If you didn't request this, please ignore this email.</p>
        </div>
        <div class="footer">
            © {% now "Y" %} Fundraiser. All rights reserved.
        </div>
    </div>
</body>
</html>
